baseURL: "https://jurij-jukic.github.io/"
locale: "en-us"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
disableKinds:
  - taxonomy
  - term

minify:
  disableXML: true
  minifyOutput: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS

params:
  env: production
  description: "Personal website and research notes by Jurij Jukić."
  author: "Jurij Jukić"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowToc: true
  TocOpen: false
  mainSections:
    - posts

  social:
    twitter: "jurij_jukic"

  socialIcons:
    - name: x
      title: "Twitter/X"
      url: "https://x.com/jurij_jukic"
    - name: github
      title: "GitHub"
      url: "https://github.com/jurij-jukic"

  homeInfoParams:
    Title: "Jurij's Thoughts on AI"

markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
